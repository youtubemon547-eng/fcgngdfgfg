<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eleven Message</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:radial-gradient(circle at 12% 0,#d6e6ff,transparent 45%),radial-gradient(circle at 92% 28%,#ffe0f0,transparent 40%),radial-gradient(circle at 20% 80%,#dcf6ff,transparent 45%),#fff;--card:#ffffffa8;--t:#000;--s:#8e8e93;--b:#2b7cf6;--ln:#e5e5ea;--r:#ff3b30;color-scheme:light}
:root[data-t=dark]{--bg:#0f0f12;--card:#2c2c2e99;--t:#fff;--s:#8e8e93;--ln:#2c2c2e;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.3 -apple-system,Roboto,sans-serif;padding-bottom:96px}
.hero{background:linear-gradient(160deg,#2b7cf6,#1d5fd6);color:#fff;padding:16px 16px 22px;border-radius:0 0 40px 40px}
.me{display:flex;gap:12px;align-items:center}.me img{width:44px;height:44px;border-radius:50%;background:#fff3}
.me b{display:block;font-size:18px}.me span{opacity:.7;font-size:14px}
.plan{margin-top:14px;height:170px;border-radius:24px;padding:18px;background:#ffffff1f;border:1px solid #fff4;display:flex;flex-direction:column;justify-content:space-between}
.plan .a{display:flex;justify-content:space-between;font-size:26px;font-weight:700}.plan i{font-size:24px}
.plan small{display:block;opacity:.7;letter-spacing:1px;font-size:11px}.plan .z{display:flex;justify-content:space-between;font-weight:600;letter-spacing:1px}
h3{margin:22px 16px 8px;color:var(--s);font-weight:500;font-size:18px}
.g{backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border:1px solid #ffffffd0;box-shadow:0 8px 30px #2b7cf61c,inset 0 1px 0 #fff;background:var(--card);border-radius:24px;margin:10px 12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.row .tt{flex:1;font-size:19px}.row .tt small{display:block;color:var(--s);font-size:15px;margin-top:2px}
.row .rt{color:var(--s)}.row:after{content:"›";color:var(--s);font-size:26px}.row.nc:after{content:none}
.nav{backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border:1px solid #ffffffd0;box-shadow:0 8px 30px #2b7cf61c,inset 0 1px 0 #fff;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;background:var(--card);border-radius:40px;padding:8px;width:min(330px,92%)}
.nav div{flex:1;text-align:center;padding:8px 0;border-radius:30px;font-size:13px;font-weight:500}.nav div span{display:block;font-size:24px}
.nav .on{background:#8881;color:var(--b)}
.btn{display:block;width:calc(100% - 32px);margin:0 16px;border:0;background:var(--b);color:#fff;font-size:19px;font-weight:600;padding:18px;border-radius:40px}
.ob{min-height:100vh;display:flex;flex-direction:column;padding:12px 0 24px}
.bars{display:flex;gap:8px;padding:0 16px}.bars i{flex:1;height:4px;border-radius:4px;background:var(--ln)}.bars i.on{background:var(--b)}
.mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.mid .em{font-size:110px}.mid h1{font-size:34px;margin:24px 0 10px}.mid p{color:var(--s);font-size:19px;margin:0}
.opt{text-align:left}.opt .row{cursor:pointer}
.sw{width:50px;height:30px;border-radius:20px;background:var(--ln);position:relative;flex:none}.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}.sw.on{background:#34c759}.sw.on:after{left:23px}
.ev{backdrop-filter:blur(24px) saturate(1.7);-webkit-backdrop-filter:blur(24px) saturate(1.7);border:1px solid #ffffffd0;box-shadow:0 8px 30px #2b7cf61c,inset 0 1px 0 #fff;background:var(--card);border-radius:20px;margin:10px 12px;padding:14px}
.ev .h{display:flex;justify-content:space-between;color:var(--s);font-size:13px;gap:8px}.ev .x{margin-top:6px;word-break:break-word;white-space:pre-wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:8px;color:#fff}.old{text-decoration:line-through;color:var(--s)}
.ev img,.ev video{max-width:100%;border-radius:12px;margin-top:8px}.lk{color:var(--b);margin-top:8px;display:inline-block}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:22px;font-weight:600}
input{width:calc(100% - 24px);margin:8px 12px;padding:14px;border-radius:16px;border:1px solid var(--ln);background:var(--card);color:var(--t);font-size:17px}
.c{text-align:center;color:var(--s);padding:36px 24px}.seg{display:flex;background:#8882;border-radius:20px;margin:14px 12px;padding:4px}.seg div{flex:1;text-align:center;padding:12px;border-radius:16px;font-weight:500}.seg .on{background:var(--card)}
</style></head><body><div id="app"></div>
<script>
const tg=Telegram.WebApp;tg.ready();tg.expand();document.documentElement.dataset.t=tg.colorScheme;
const $=s=>document.querySelector(s),app=$('#app'),sub=crypto.subtle;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const API_BASE='';// только если index.html лежит на ДРУГОМ хостинге: впиши URL бота
const api=(a,b={})=>fetch(API_BASE+'/api/'+a,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init:tg.initData,...b})}).then(r=>r.json());
const b64=u=>{let s='';new Uint8Array(u).forEach(c=>s+=String.fromCharCode(c));return btoa(s)},ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const S={me:null,priv:null,mode:'cloud',tab:'home',ev:null,err:''};
const cb=(m,k,v)=>new Promise(r=>{try{tg[m].getItem?tg[m].getItem(k,(e,x)=>r(x||null)):r(null)}catch{r(null)}});
const store={
 cloud:{get:k=>cb('CloudStorage',k),set:(k,v)=>new Promise(r=>tg.CloudStorage.setItem(k,v,()=>r()))},
 device:{get:k=>tg.DeviceStorage?cb('DeviceStorage',k):Promise.resolve(localStorage.getItem(k)),
  set:(k,v)=>tg.DeviceStorage?new Promise(r=>tg.DeviceStorage.setItem(k,v,()=>r())):Promise.resolve(localStorage.setItem(k,v))}};
const RSA={name:'RSA-OAEP',hash:'SHA-256'};
const imp=v=>sub.importKey('pkcs8',ub(v),RSA,false,['decrypt']);
async function pwk(p,s){const m=await sub.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return sub.deriveKey({name:'PBKDF2',salt:s,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function wrap(pk,p){const s=crypto.getRandomValues(new Uint8Array(16)),n=crypto.getRandomValues(new Uint8Array(12));
 const c=await sub.encrypt({name:'AES-GCM',iv:n},await pwk(p,s),ub(pk));return JSON.stringify({s:b64(s),n:b64(n),c:b64(c)})}
async function unwrap(w,p){const o=JSON.parse(w);return imp(b64(await sub.decrypt({name:'AES-GCM',iv:ub(o.n)},await pwk(p,ub(o.s)),ub(o.c))))}
async function dec(p){const o=JSON.parse(p),k=await sub.decrypt({name:'RSA-OAEP'},S.priv,ub(o.k));
 const a=await sub.importKey('raw',k,'AES-GCM',false,['decrypt']);return sub.decrypt({name:'AES-GCM',iv:ub(o.n)},a,ub(o.c))}
async function makeKey(mode,pw,reset){
 const kp=await sub.generateKey({...RSA,modulusLength:2048,publicExponent:new Uint8Array([1,0,1])},true,['encrypt','decrypt']);
 const pub=b64(await sub.exportKey('spki',kp.publicKey)),pk=b64(await sub.exportKey('pkcs8',kp.privateKey));
 await store.cloud.set('nk','');await store.device.set('nk','');await store.cloud.set('nkp','');
 if(mode=='cloud')await store.cloud.set('nk',pk);else if(mode=='device')await store.device.set('nk',pk);else await store.cloud.set('nkp',await wrap(pk,pw));
 const r=await api('key',{pub,reset});if(r.err)throw 0;S.priv=await imp(pk);S.mode=mode;S.me.has_key=true;S.ev=null}
async function loadKey(){let v=await store.cloud.get('nk');if(v){S.mode='cloud';return imp(v)}
 v=await store.device.get('nk');if(v){S.mode='device';return imp(v)}
 v=await store.cloud.get('nkp');if(v){S.mode='pw';return 'PW:'+v}return null}

// ---------- онбординг ----------
const SL=[['🦆','Привет!','Eleven Message сохраняет удалённые и изменённые сообщения из твоих чатов. Сейчас коротко расскажем, почему стоит выбрать именно его.'],
['🔓','Сквозное шифрование','Каждое сообщение шифруется сразу при получении. Расшифровать его можно только твоим ключом, поэтому даже мы не можем прочитать твои сообщения.'],
['KEY'],['🔍','Открытый код','На сервере лежит только шифротекст. Код бота открыт, любой может проверить, как он работает.'],
['🤖','Магазин плагинов','Новые возможности включаются в один клик. Любой может написать свой плагин и выложить его в магазин, а мы проверим каждый перед публикацией.']];
function ob(i){const s=SL[i],bars=`<div class="bars">${SL.map((_,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div>`;
 if(s[0]=='KEY')return app.innerHTML=`<div class="ob">${bars}<div class="mid"><div class="em" style="font-size:80px">🔐</div><h1 style="font-size:30px">Где хранить твой ключ?</h1>
 <p>Закрытый ключ расшифровывает сохранённые сообщения. Без него их не прочитать.</p></div><div class="opt">
 <h3>Проще всего</h3><div class="g"><div class="row" data-k="cloud"><div class="ic" style="background:#3b8cf6">☁️</div><div class="tt">В Telegram<small>Облачное хранилище Telegram, на всех устройствах</small></div></div></div>
 <h3>Надёжнее</h3><div class="g"><div class="row" data-k="device"><div class="ic" style="background:#34c07a">🔒</div><div class="tt">В этом телефоне<small>Защищённое хранилище, только на этом устройстве</small></div></div>
 <div class="row" data-k="pw"><div class="ic" style="background:#f5a03a">🔑</div><div class="tt">Под паролем<small>Ключ шифруется паролем, его знаешь только ты</small></div></div></div>
 <input id="pw" type="password" placeholder="Пароль (для режима «Под паролем»)"><p class="c" style="padding:6px">${S.err}Ключ создаётся на твоём устройстве. Закрытая часть никогда не попадает на сервер.</p></div></div>`,
 app.querySelectorAll('[data-k]').forEach(el=>el.onclick=async()=>{const k=el.dataset.k,pw=$('#pw').value;
  if(k=='pw'&&pw.length<6){S.err='Пароль от 6 символов. ';return ob(i)}S.err='';
  app.innerHTML='<div class="c">Создаём ключ…</div>';try{await makeKey(k,pw,!!S.reset);ob(i+1)}catch(e){S.err='Ошибка, попробуй ещё раз. ';ob(i)}});
 app.innerHTML=`<div class="ob">${bars}<div class="mid"><div class="em">${s[0]}</div><h1>${s[1]}</h1><p>${s[2]}</p></div>
 <button class="btn" id="nx">${i==SL.length-1?'Начнём':'Дальше'}</button></div>`;
 $('#nx').onclick=()=>i==SL.length-1?main():ob(i+1)}

// ---------- события ----------
async function events(){if(S.ev)return S.ev;const r=await api('events'),m={};const out=[];
 for(const e of r.ev){try{e.d=JSON.parse(new TextDecoder().decode(await dec(e.p)))}catch{e.d={text:'🔒 не удалось расшифровать',chat:'?',from:'?'}}out.push(e);if(e.kind=='msg')m[e.chat+':'+e.mid]=e}
 out.forEach(e=>{if(e.kind=='edit')e.orig=m[e.chat+':'+e.mid]});return S.ev=out}
const fmt=t=>new Date(t*1000).toLocaleString('ru',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const FIL={del:e=>e.kind=='msg'&&e.del,edit:e=>e.kind=='edit',media:e=>e.kind=='msg'&&e.d.t&&!e.d.once,once:e=>e.kind=='msg'&&e.d.once,all:e=>true};
const TT={del:'Удалённые',edit:'Изменённые',media:'Фото и видео',once:'Одноразовые',all:'История'};
function card(e){const d=e.d;let x=esc(d.text||(d.t?'':'—'));
 if(e.kind=='edit')x=(e.orig?`<div class="old">${esc(e.orig.d.text)}</div>`:'')+x;
 const tag=e.kind=='edit'?'<span class="tag" style="background:#f5a03a">изменено</span>':e.del?'<span class="tag" style="background:var(--r)">удалено</span>':'';
 return `<div class="ev"><div class="h"><span>${esc(d.chat)} · ${esc(d.from)}</span>${tag}</div><div class="x">${x}</div>
 ${e.blob?`<span class="lk" data-b="${e.id}">▶ Показать ${esc(d.t)}</span><div id="b${e.id}"></div>`:d.t?`<div class="h" style="margin-top:6px">${esc(d.t)} (не сохранено)</div>`:''}
 <div class="h" style="margin-top:8px"><span>${fmt(e.ts)}</span>${e.del?`<span>удалено ${fmt(e.dts)}</span>`:''}</div></div>`}
async function list(k){S.view=k;tg.BackButton.show();tg.BackButton.onClick(()=>{tg.BackButton.hide();S.view=null;main()});
 app.innerHTML='<div class="c">Загрузка…</div>';const ev=(await events()).filter(FIL[k]);const on=S.me.st[k];
 app.innerHTML=`<div class="top">${TT[k]}</div>${k!='all'?`<div class="g"><div class="row nc" id="tg"><div class="tt">Сохранять</div><div class="sw ${on?'on':''}"></div></div></div>`:''}
 ${ev.map(card).join('')||'<div class="c">Пока пусто</div>'}`;
 if($('#tg'))$('#tg').onclick=async()=>{S.me.st=(await api('set',{st:{[k]:on?0:1}})).st;list(k)};
 app.querySelectorAll('[data-b]').forEach(el=>el.onclick=async()=>{const e=ev.find(x=>x.id==el.dataset.b),r=await api('blob',{id:e.id});
  const u=URL.createObjectURL(new Blob([await dec(r.d)],{type:e.d.mime})),m=e.d.mime||'',t=m.startsWith('image')?'img':m.startsWith('video')?'video controls':m.startsWith('audio')?'audio controls':'';
  $('#b'+e.id).innerHTML=t?`<${t.split(' ')[0]} src="${u}" ${t.includes('controls')?'controls':''}></${t.split(' ')[0]}>`:`<a class="lk" href="${u}" download="${esc(e.d.name||'file')}">Скачать</a>`;el.remove()})}
async function kwView(){tg.BackButton.show();tg.BackButton.onClick(()=>{tg.BackButton.hide();main()});const draw=()=>{app.innerHTML=`<div class="top">Ключевые слова</div><p class="c" style="padding:0 20px 8px">Бот пришлёт уведомление, если слово встретится во входящем сообщении.</p>
 <input id="w" placeholder="Новое слово"><button class="btn" id="add">Добавить</button><div class="g" style="margin-top:16px">${S.me.st.kw.map((w,i)=>`<div class="row nc"><div class="tt">${esc(w)}</div><span data-x="${i}" style="color:var(--r)">Удалить</span></div>`).join('')}</div>`;
 $('#add').onclick=async()=>{const w=$('#w').value.trim();if(w){S.me.st=(await api('set',{st:{kw:[...S.me.st.kw,w]}})).st;draw()}};
 app.querySelectorAll('[data-x]').forEach(el=>el.onclick=async()=>{const k=[...S.me.st.kw];k.splice(+el.dataset.x,1);S.me.st=(await api('set',{st:{kw:k}})).st;draw()})};draw()}
async function ignView(){tg.BackButton.show();tg.BackButton.onClick(()=>{tg.BackButton.hide();main()});const ev=await events(),ch={};ev.forEach(e=>ch[e.chat]=ch[e.chat]||e.d.chat);
 S.me.st.ign.forEach(i=>ch[i]=ch[i]||'Чат '+i);const draw=()=>{app.innerHTML=`<div class="top">Чаты без слежки</div><p class="c" style="padding:0 20px 8px">Сообщения из отмеченных чатов не сохраняются.</p><div class="g">
 ${Object.entries(ch).map(([id,n])=>`<div class="row nc" data-c="${id}"><div class="tt">${esc(n)}</div><div class="sw ${S.me.st.ign.includes(+id)?'on':''}"></div></div>`).join('')||'<div class="c">Чаты появятся после первых сообщений</div>'}</div>`;
 app.querySelectorAll('[data-c]').forEach(el=>el.onclick=async()=>{const id=+el.dataset.c,s=S.me.st.ign,n=s.includes(id)?s.filter(x=>x!=id):[...s,id];S.me.st=(await api('set',{st:{ign:n}})).st;draw()})};draw()}

// ---------- главный экран ----------
const R=(c,i,t,r='',a='',s='')=>`<div class="row" data-a="${a}"><div class="ic" style="background:${c}">${i}</div><div class="tt">${t}${s?`<small>${s}</small>`:''}</div><span class="rt">${r}</span></div>`;
const V=k=>S.me.st[k]?'Вкл':'Выкл',u=tg.initDataUnsafe.user||{};
function main(){S.view=null;tg.BackButton.hide();const t=S.tab,ok=S.me.conns.length;
 let h='';
 if(t=='home')h=`<div class="hero"><div class="me"><img src="${esc(u.photo_url||'')}"><div><b>${esc(u.first_name||'')} ${esc(u.last_name||'')}</b><span>${u.username?'@'+esc(u.username):''}</span></div></div>
 <div class="plan"><div class="a">Eleven Message<i>FREE</i></div><div class="z"><div><small>ВЛАДЕЛЕЦ</small>${esc((u.first_name||'').toUpperCase())}</div><div style="text-align:right"><small>СРОК</small>БЕССРОЧНО</div></div></div></div>
 <div class="g">${ok?R('#34c759','✅','Бот подключён','','','Сообщения сохраняются'):R('#3b8cf6','🔌','Подключи бота','','how','Настройки › Telegram Business › Чат-боты › @'+S.me.bot)}</div>
 <h3>Основное</h3><div class="g">${R('#f0524a','🗑','Удалённые',V('del'),'del')}${R('#f5a03a','✏️','Изменённые',V('edit'),'edit')}${R('#b97ae0','🖼','Фото и видео',V('media'),'media')}${R('#f0557d','🔥','Одноразовые',V('once'),'once')}</div>
 <h3>Ещё</h3><div class="g">${R('#3b8cf6','🕘','История','','all')}${R('#6b66f0','#','Ключевые слова','','kw')}${R('#8e8e93','🙈','Чаты без слежки','','ign')}</div>
 <div class="g">${R('#6b66f0','⏱','Сколько хранить',S.me.st.days+' дней','days')}</div>`;
 if(t=='plug')h=`<div class="mid" style="min-height:auto;padding-top:30px"><div class="em" style="font-size:90px">🤖</div><h1 style="font-size:30px">Плагины</h1><p>Новые возможности бота в один клик. Включай только то, что нужно.</p></div>
 <div class="seg"><div class="on">Установленные</div><div id="shop">Магазин</div></div><div class="c" id="pl"><b style="color:var(--t);font-size:20px">Пока ничего не установлено</b><br><br>Загляни в магазин: там есть полезные плагины, которые ставятся в один клик.</div>`;
 if(t=='set')h=`<h3>Подписка</h3><div class="g">${R('#b97ae0','⭐','Мой план','Free','plan')}${R('#f0557d','#','Промокод','','promo')}</div>
 <h3>Хранение</h3><div class="g">${R('#6b66f0','⏱','Сколько хранить',S.me.st.days+' дней','days')}${R('#34c759','🔔','Текст в уведомлениях',V('full'),'full')}</div>
 <h3>Защита</h3><div class="g">${R('#3b8cf6','☁️','Мой ключ',{cloud:'В Telegram',device:'В телефоне',pw:'Под паролем'}[S.mode],'')}${R('#8e8e93','🔑','Сменить ключ','','chg')}${R('#34c07a','🛡','Почему нам можно верить','','trust')}${R('#6b66f0','🔒','Как устроена защита','','how2')}</div>
 <h3>Помощь</h3><div class="g">${R('#3b8cf6','🔌','Как подключить бота','','how')}${R('#b97ae0','❓','Как это работает','','ob')}</div>
 <div class="g"><div class="row nc" data-a="wipe" style="color:var(--r);font-size:19px">Удалить мои данные</div></div>`;
 app.innerHTML=h+`<div class="nav">${[['home','🏠','Главная'],['plug','🧩','Плагины'],['set','⚙️','Настройки']].map(([k,i,n])=>`<div data-n="${k}" class="${t==k?'on':''}"><span>${i}</span>${n}</div>`).join('')}</div>`;
 app.querySelectorAll('[data-n]').forEach(el=>el.onclick=()=>{S.tab=el.dataset.n;main()});
 app.querySelectorAll('[data-a]').forEach(el=>el.onclick=()=>act(el.dataset.a));
 if($('#shop'))$('#shop').onclick=()=>{$('#pl').innerHTML='Ничего не нашлось. Скоро здесь появятся плагины от других людей. Мы проверим каждый перед публикацией.'}}
async function act(a){
 if(FIL[a])return list(a);if(a=='kw')return kwView();if(a=='ign')return ignView();if(a=='ob')return ob(0);
 if(a=='how'||a=='how2')return tg.showAlert(a=='how'?`Настройки Telegram › Telegram Business › Чат-боты › выбери @${S.me.bot} и дай доступ к чатам.`:'Сообщения шифруются на сервере публичным ключом. Закрытый ключ хранится только у тебя, сервер не может прочитать сохранённое.');
 if(a=='trust')return tg.showAlert('Сервер хранит только шифротекст, а закрытый ключ создаётся и остаётся на твоём устройстве.');
 if(a=='full'){S.me.st=(await api('set',{st:{full:S.me.st.full?0:1}})).st;return main()}
 if(a=='plan'||a=='promo')return tg.showAlert('Скоро');
 if(a=='days')return tg.showPopup({message:'Сколько хранить сообщения?',buttons:[7,30,90,365].map(d=>({id:''+d,type:'default',text:d+' дней'}))},async id=>{if(id){S.me.st=(await api('set',{st:{days:+id}})).st;main()}});
 if(a=='chg')return tg.showConfirm('Новый ключ не расшифрует старые сообщения: они будут удалены. Продолжить?',ok=>{if(ok){S.reset=1;S.err='';ob(2)}});
 if(a=='wipe')return tg.showConfirm('Удалить все данные безвозвратно?',async ok=>{if(ok){await api('wipe');await store.cloud.set('nk','');await store.device.set('nk','');await store.cloud.set('nkp','');tg.close()}})}

// ---------- старт ----------
(async()=>{app.innerHTML='<div class="c">…</div>';S.me=await api('me');if(S.me.err)return app.innerHTML='<div class="c">Открой приложение из Telegram</div>';
 if(!S.me.has_key)return ob(0);
 let k=await loadKey();
 if(k&&typeof k=='string'){const ask=(m='')=>{app.innerHTML=`<div class="ob"><div class="mid"><div class="em">🔑</div><h1>Пароль</h1><p>${m}</p></div><input id="p" type="password" placeholder="Пароль от ключа"><button class="btn" id="go">Открыть</button></div>`;
  $('#go').onclick=async()=>{try{S.priv=await unwrap(k.slice(3),$('#p').value);main()}catch{ask('Неверный пароль')}}};return ask()}
 if(k){S.priv=k;return main()}
 app.innerHTML=`<div class="ob"><div class="mid"><div class="em">🗝</div><h1>Ключ не найден</h1><p>На этом устройстве нет ключа. Можно создать новый, но старые сохранённые сообщения будут удалены.</p></div><button class="btn" id="nk">Создать новый ключ</button></div>`;
 $('#nk').onclick=()=>{S.reset=1;ob(2)}})();
</script></body></html>
